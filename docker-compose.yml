services:
  backend:
    build:
      context: ./backend
    container_name: proxmox-dashboard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/immich:/mnt/immich:ro
    user: root
    env_file: ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: proxmox-dashboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
