services:
  backend:
    build:
      context: ./backend
    container_name: proxmox-dashboard-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: proxmox-dashboard-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
